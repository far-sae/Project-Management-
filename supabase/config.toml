# Edge Functions: allow invocation without strict JWT verification (fixes 401 on checkout/cancel)
# See: https://supabase.com/docs/guides/functions/function-configuration

[functions.create-checkout-session]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Cancel-now validates JWT inside the function; disable gateway JWT so we return clear 401 body
[functions.cancel-subscription-now]
verify_jwt = false

[functions.create-checkout-extra-seat]
verify_jwt = false

[functions.remove-member]
verify_jwt = false

# AI proxy - invoked from browser; JWT not reliably passed in some deployments
[functions.ai-chat]
verify_jwt = false

# Admin-only; validates JWT inside function (verify_jwt=false so OPTIONS preflight passes CORS)
[functions.public-stats]
verify_jwt = false

# LiveKit token signing — validates Supabase JWT inside the function so we can
# return clean 401 bodies; gateway-level verify is off to keep CORS preflight working.
[functions.livekit-token]
verify_jwt = false

# Browser-invoked automation/agent functions validate authorization inside the
# function. Gateway JWT verification must be off so OPTIONS preflight can return
# CORS headers instead of being rejected before the function runs.
[functions.crm-run-automations]
verify_jwt = false

[functions.crm-stuck-deal-scanner]
verify_jwt = false

[functions.ai-agent-suggest]
verify_jwt = false

[functions.ai-agent-approve]
verify_jwt = false

[functions.slack-list-channels]
verify_jwt = false

# Public webhook endpoints validate provider signatures or public form rules
# inside the function, so gateway JWT verification must stay off.
[functions.slack-events]
verify_jwt = false

[functions.forms-submit]
verify_jwt = false

[functions.forms-get]
verify_jwt = false

[functions.gmail-inbound]
verify_jwt = false

# OAuth + integrations endpoints called without a Supabase JWT:
#  - oauth-callback: reached by Google/Slack redirect after consent. No
#    Authorization header — function authenticates via HMAC-signed `state` param.
#  - integrations-webhook: provider-initiated POSTs. Function verifies signature
#    headers (Slack/Google etc.) before acting.
# Without verify_jwt=false here the Supabase gateway 401s with
# UNAUTHORIZED_NO_AUTH_HEADER before the function code runs, which manifests
# in the browser as "{"code":"UNAUTHORIZED_NO_AUTH_HEADER",
# "message":"Missing authorization header"}" right after Gmail/Google connect.
[functions.oauth-callback]
verify_jwt = false

[functions.integrations-webhook]
verify_jwt = false
