<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i20{width:20px;height:20px}
.dk:hover{background:#3a3a3a}
.out:hover{background:#fafafa;border-color:#c9c9c9}
button:focus-visible{outline:2px solid #ea580c;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; padding: 40px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px; background: #f5f5f5; color: #171717; font-family: 'Geist', 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 20px">

<div style="flex: 2 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 13px; font-weight: 500; color: #666666">In a call</h2>
<section aria-label="Active call" style="display: flex; flex-direction: column; border-radius: 12px; background: #0a0a0a; color: #ffffff; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 56px; box-sizing: border-box; padding: 8px 12px 8px 16px">
<div style="flex: 1 1 200px; min-width: 0">
<p style="margin: 0; font-size: 14px; line-height: 18px; font-weight: 600">Website relaunch</p>
<p style="margin: 0; font-size: 12px; line-height: 16px; color: #a3a3a3; font-variant-numeric: tabular-nums">Project call · 3 people · 12:48</p>
</div>
<button class="dk" type="button" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid #3a3a3a; border-radius: 6px; background: #1c1c1c; color: #ffffff; font-size: 13px; font-weight: 500"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>Invite guest</button>
<button class="dk" type="button" aria-label="Pop out call" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 1px solid #3a3a3a; border-radius: 6px; background: #1c1c1c; color: #ffffff"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1"/></svg></button>
<button class="dk" type="button" aria-label="Minimize call" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 1px solid #3a3a3a; border-radius: 6px; background: #1c1c1c; color: #ffffff"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding: 4px 12px 12px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
<div style="position: relative; flex: 0 1 calc(50% - 6px); min-width: 220px; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; box-sizing: border-box; border: 2px solid {{t.ring}}; border-radius: 10px; background: #1c1c1c">
<span style="display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 36px; background: {{t.bg}}; color: #171717; font-size: 28px; font-weight: 600">{{t.initial}}</span>
<span style="position: absolute; left: 8px; bottom: 8px; display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; background: rgba(0,0,0,0.7); color: #ffffff; font-size: 12px; font-weight: 500">{{t.name}}<sc-if value="{{t.muted}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" role="img" aria-label="Microphone off" style="width: 12px; height: 12px; color: #fda29b"><path d="M2 2l20 20M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.7-1.3M19 10v2a7 7 0 0 1-.8 3.2M5 10v2a7 7 0 0 0 11 5.7M12 19v3"/></svg></sc-if></span>
</div>
</sc-for>
</div>
<div role="toolbar" aria-label="Call controls" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px 16px; border-top: 1px solid #262626">
<button class="dk" type="button" aria-label="Mute microphone" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 24px; background: #262626; color: #ffffff"><svg class="i i20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg></button>
<button class="dk" type="button" aria-label="Turn camera off" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 24px; background: #262626; color: #ffffff"><svg class="i i20" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></button>
<button class="dk" type="button" aria-label="Share screen" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 24px; background: #262626; color: #ffffff"><svg class="i i20" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
<button class="dk" type="button" aria-label="Record meeting" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 24px; background: #262626; color: #ffffff"><svg class="i i20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></button>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border: 0; border-radius: 24px; background: #d92d20; color: #ffffff; font-size: 14px; font-weight: 600"><svg class="i i20" viewBox="0 0 24 24" aria-hidden="true" style="transform: rotate(135deg)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>End call</button>
</div>
</section>
</div>

<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 32px">

<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 13px; font-weight: 500; color: #666666">Incoming call</h2>
<section aria-label="Incoming video call from Sara Lopez" style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; border: 1px solid #e0e0e0; border-radius: 12px; background: #ffffff; box-shadow: 0 12px 32px rgba(0,0,0,0.10)">
<span style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 32px; background: #dcfce7; font-size: 24px; font-weight: 600">S</span>
<div style="text-align: center">
<p style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600">Sara Lopez</p>
<p style="margin: 0; font-size: 13px; color: #666666">Incoming video call</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; width: 100%">
<button type="button" style="flex: 1 1 88px; display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: #d92d20; color: #ffffff; font-size: 13px; font-weight: 600">Decline</button>
<button class="out" type="button" aria-label="Accept with audio" style="flex: 1 1 88px; display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 12px; border: 1px solid #e0e0e0; border-radius: 8px; background: #ffffff; color: #171717; font-size: 13px; font-weight: 600"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Audio</button>
<button type="button" aria-label="Accept with video" style="flex: 1 1 88px; display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: #15803d; color: #ffffff; font-size: 13px; font-weight: 600"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>Video</button>
</div>
</section>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 13px; font-weight: 500; color: #666666">Small floating call, after you minimise</h2>
<section aria-label="Active call, minimised" style="display: flex; flex-direction: column; max-width: 320px; border-radius: 12px; background: #0a0a0a; color: #ffffff; box-shadow: 0 12px 32px rgba(0,0,0,0.24); overflow: hidden">
<div style="display: flex; align-items: center; justify-content: center; height: 150px; background: #1c1c1c">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 28px; background: #dcfce7; color: #171717; font-size: 22px; font-weight: 600">S</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px">
<div style="flex: 1; min-width: 0">
<p style="margin: 0; font-size: 13px; line-height: 18px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Website relaunch</p>
<p style="margin: 0; font-size: 12px; line-height: 16px; color: #a3a3a3; font-variant-numeric: tabular-nums">12:48</p>
</div>
<button class="dk" type="button" aria-label="Mute microphone" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 18px; background: #262626; color: #ffffff"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg></button>
<button class="dk" type="button" aria-label="Expand call" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 18px; background: #262626; color: #ffffff"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
<button type="button" aria-label="End call" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 18px; background: #d92d20; color: #ffffff"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="transform: rotate(135deg)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
</div>
</section>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {
tiles: [
{ name: 'Sara Lopez', initial: 'S', bg: '#dcfce7', muted: false, ring: '#22c55e' },
{ name: 'Mo Ali', initial: 'M', bg: '#fef3c7', muted: true, ring: '#1c1c1c' },
{ name: 'You', initial: 'F', bg: '#ede9fe', muted: false, ring: '#1c1c1c' }
]
};
}
}
</script>
</body>
</html>
