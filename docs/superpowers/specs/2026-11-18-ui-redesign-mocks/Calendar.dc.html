<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i14{width:14px;height:14px}
.nav:hover,.ghost:hover{background:#ededed}
.out:hover{background:#fafafa;border-color:#c9c9c9}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ea580c;outline-offset:2px}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 960px; box-sizing: border-box; background: #ffffff; color: #171717; font-family: 'Geist', 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 20px">

<aside style="flex: 1 0 240px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 12px; background: #fafafa; border-right: 1px solid #eaeaea">
<button class="ghost" type="button" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: #171717; text-align: left">
<span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 6px; background: #171717; color: #ffffff; font-size: 12px; font-weight: 600">T</span>
<span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600">TaskCalendar</span>
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #666666"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
</button>
<nav aria-label="Main" style="display: flex; flex-direction: column; gap: 2px">
<a class="nav" href="#projects" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #666666"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v11M12 5v6M18 5v14"/></svg>Project Management</a>
<a class="nav" href="#analytics" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #666666"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>Projects analytics</a>
<a class="nav" href="#tasks" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #666666"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>My Tasks</a>
<a class="nav" href="#inbox" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #666666"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><span style="flex: 1">Inbox</span><span style="min-width: 18px; padding: 0 5px; border-radius: 9px; background: #171717; color: #ffffff; font-size: 11px; line-height: 18px; text-align: center">3</span></a>
<a class="nav" href="#calendar" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 500; background: #ededed; color: #171717"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendar</a>
<a class="nav" href="#workload" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #666666"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Workload</a>
<a class="nav" href="#reports" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #666666"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>Reports</a>
<a class="nav" href="#team" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #666666"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Team</a>
<a class="nav" href="#hr" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #666666"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M16 11l2 2 4-4"/></svg>HR</a>
</nav>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
<button class="out" type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 12px; border: 1px solid #e0e0e0; border-radius: 6px; background: #ffffff; color: #171717; font-size: 13px; font-weight: 500"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Clock in</button>
<a class="nav" href="#account" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px; border-radius: 6px"><span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; background: #ede9fe; font-size: 11px; font-weight: 600">F</span><span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 500">Account</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #666666"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/></svg></a>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; min-height: 56px; box-sizing: border-box; padding: 8px 24px; border-bottom: 1px solid #eaeaea">
<div style="flex: 1 1 200px; min-width: 0; font-size: 14px; font-weight: 600">Calendar</div>
<button class="out" type="button" style="display: flex; align-items: center; gap: 8px; width: 240px; height: 32px; padding: 0 8px 0 10px; border: 1px solid #e0e0e0; border-radius: 6px; background: #ffffff; color: #666666; font-size: 13px; text-align: left"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg><span style="flex: 1">Search projects, tasks…</span><kbd style="padding: 0 6px; border: 1px solid #e0e0e0; border-radius: 4px; background: #fafafa; font-family: inherit; font-size: 11px; line-height: 18px">Ctrl K</kbd></button>
</header>

<div style="width: 100%; max-width: 1200px; box-sizing: border-box; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
<div style="flex: 1 1 320px; min-width: 0">
<h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em">November 2026</h1>
<p style="margin: 4px 0 0; font-size: 14px; color: #666666">View tasks by due date</p>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button class="ghost" type="button" style="height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #171717; font-size: 13px; font-weight: 500">Today</button>
<div style="display: flex; align-items: center; border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden">
<button class="ghost" type="button" aria-label="Previous month" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 30px; padding: 0; border: 0; border-right: 1px solid #e0e0e0; background: #ffffff; color: #171717"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
<button class="ghost" type="button" aria-label="Next month" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 30px; padding: 0; border: 0; background: #ffffff; color: #171717"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 1px; border: 1px solid #eaeaea; border-radius: 8px; background: #eaeaea; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; background: #ffffff"><span style="font-size: 13px; color: #666666">Due this month</span><span style="font-size: 20px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums">17</span></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; background: #ffffff"><span style="font-size: 13px; color: #666666">Completed</span><span style="font-size: 20px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums">5</span></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; background: #ffffff"><span style="font-size: 13px; color: #666666">Urgent</span><span style="font-size: 20px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums; color: #b42318">2</span></div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 11px; font-weight: 600">
<span style="height: 20px; padding: 0 8px; border-radius: 4px; background: #d92d20; color: #ffffff; line-height: 20px">Urgent</span>
<span style="height: 20px; box-sizing: border-box; padding: 0 8px; border: 1px solid #f5c2bd; border-radius: 4px; background: #fef3f2; color: #b42318; line-height: 18px">High</span>
<span style="height: 20px; box-sizing: border-box; padding: 0 8px; border: 1px solid #f3d488; border-radius: 4px; background: #fffaeb; color: #8a4b0b; line-height: 18px">Medium</span>
<span style="height: 20px; box-sizing: border-box; padding: 0 8px; border: 1px solid #e0e0e0; border-radius: 4px; background: #f5f5f5; color: #4d4d4d; line-height: 18px">Low</span>
<span style="height: 20px; box-sizing: border-box; padding: 0 8px; border: 1px solid #e5e5e5; border-radius: 4px; background: #ffffff; color: #666666; line-height: 18px; text-decoration: line-through">Done</span>
</div>

<div style="border: 1px solid #eaeaea; border-radius: 8px; overflow-x: auto">
<div style="min-width: 760px">
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: 36px; align-items: center; border-bottom: 1px solid #eaeaea; background: #fafafa; font-size: 12px; font-weight: 500; color: #666666">
<span style="padding: 0 10px">Sun</span><span style="padding: 0 10px">Mon</span><span style="padding: 0 10px">Tue</span><span style="padding: 0 10px">Wed</span><span style="padding: 0 10px">Thu</span><span style="padding: 0 10px">Fri</span><span style="padding: 0 10px">Sat</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: #eaeaea">
<sc-for list="{{days}}" as="d" hint-placeholder-count="35">
<div style="display: flex; flex-direction: column; gap: 4px; min-height: 104px; box-sizing: border-box; padding: 6px; background: {{d.bg}}">
<span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; background: {{d.numBg}}; color: {{d.numColor}}; font-size: 12px; font-weight: {{d.numWeight}}; font-variant-numeric: tabular-nums">{{d.num}}</span>
<sc-for list="{{d.chips}}" as="c" hint-placeholder-count="1">
<a href="#task" style="display: block; height: 20px; box-sizing: border-box; padding: 0 6px; border: 1px solid {{c.border}}; border-radius: 4px; background: {{c.bg}}; color: {{c.text}}; font-size: 11px; font-weight: 500; line-height: 18px; text-decoration: {{c.deco}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.label}}</a>
</sc-for>
<sc-if value="{{d.hasMore}}" hint-placeholder-val="{{false}}"><span style="padding: 0 6px; font-size: 11px; color: #666666">{{d.more}}</span></sc-if>
</div>
</sc-for>
</div>
</div>
</div>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
var STYLE = {
urgent: { bg: '#d92d20', text: '#ffffff', border: '#d92d20', deco: 'none' },
high: { bg: '#fef3f2', text: '#b42318', border: '#f5c2bd', deco: 'none' },
medium: { bg: '#fffaeb', text: '#8a4b0b', border: '#f3d488', deco: 'none' },
low: { bg: '#f5f5f5', text: '#4d4d4d', border: '#e0e0e0', deco: 'none' },
done: { bg: '#ffffff', text: '#666666', border: '#e5e5e5', deco: 'line-through' }
};
var TASKS = {
2: [['Kick-off call with the client', 'done']],
4: [['Choose colours and fonts', 'done']],
6: [['Order new desks', 'low']],
9: [['Move the domain to the new host', 'done']],
10: [['Brand refresh brief', 'medium']],
12: [['Sitemap sign-off', 'done']],
13: [['Client contract review', 'high']],
16: [['Logo options', 'done']],
17: [['Set up the contact form', 'high']],
18: [['Build the new navigation menu', 'urgent'], ['About page first draft', 'medium'], ['Confirm movers for Friday', 'medium']],
19: [['Write homepage copy', 'urgent'], ['Review app store screenshots', 'low']],
20: [['Send welcome pack to new client', 'medium'], ['Collect client logos', 'low']],
23: [['Book the product photo shoot', 'medium']],
27: [['Mobile app beta build', 'high']]
};
var days = [];
for (var i = 1; i <= 35; i++) {
var inMonth = i <= 30;
var num = inMonth ? i : i - 30;
var today = i === 18;
var list = (inMonth && TASKS[i]) || [];
var chips = list.slice(0, 2).map(function (t) {
var s = STYLE[t[1]];
return { label: t[0], bg: s.bg, text: s.text, border: s.border, deco: s.deco };
});
days.push({
num: num,
bg: inMonth ? '#ffffff' : '#fafafa',
numBg: today ? '#171717' : 'transparent',
numColor: today ? '#ffffff' : (inMonth ? '#171717' : '#8f8f8f'),
numWeight: today ? 600 : 500,
chips: chips,
hasMore: list.length > 2,
more: '+' + (list.length - 2) + ' more'
});
}
return { days: days };
}
}
</script>
</body>
</html>
